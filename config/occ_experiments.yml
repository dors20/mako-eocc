defaults:
  workdir: /home/azureuser/mako-eocc
  results_root: /home/azureuser/mako-eocc/results/occ_runs

scenarios:
  - name: baseline_simple
    description: Baseline OCC with sequential validation using simpleTransaction.
    command: "./build/simpleTransaction"
    env:
      MAKO_ENABLE_BATCH_VALIDATION: "0"

  - name: batch_validation_simple
    description: OCC with batch validation enabled using simpleTransaction.
    command: "./build/simpleTransaction"
    placeholders:
      batch_size:
        fast: 16
        full: 64
      batch_wait_us:
        fast: 1000
        full: 5000
    env:
      MAKO_ENABLE_BATCH_VALIDATION: "1"
      MAKO_BATCH_VALIDATION_SIZE: "{batch_size}"
      MAKO_BATCH_VALIDATION_MAX_WAIT_US: "{batch_wait_us}"

  - name: batch_validation_storage_simple
    description: Batch validation with storage-stage reordering on simpleTransaction.
    command: "./build/simpleTransaction"
    placeholders:
      batch_size:
        fast: 16
        full: 64
      batch_wait_us:
        fast: 1000
        full: 5000
      storage_batch:
        fast: 16
        full: 64
      storage_wait_us:
        fast: 500
        full: 2000
    env:
      MAKO_ENABLE_BATCH_VALIDATION: "1"
      MAKO_BATCH_VALIDATION_SIZE: "{batch_size}"
      MAKO_BATCH_VALIDATION_MAX_WAIT_US: "{batch_wait_us}"
      MAKO_ENABLE_STORAGE_REORDER: "1"
      MAKO_STORAGE_REORDER_SIZE: "{storage_batch}"
      MAKO_STORAGE_REORDER_MAX_WAIT_US: "{storage_wait_us}"

  - name: baseline_stress
    description: Baseline sequential validation using test_batch_validation_stress.
    command: "./build/test_batch_validation_stress {threads} {txns_per_thread}"
    placeholders:
      threads:
        fast: 2
        full: 8
      txns_per_thread:
        fast: 500
        full: 5000
    env:
      MAKO_ENABLE_BATCH_VALIDATION: "0"

  - name: batch_validation_stress
    description: Batch validation enabled for test_batch_validation_stress.
    command: "./build/test_batch_validation_stress {threads} {txns_per_thread}"
    placeholders:
      threads:
        fast: 2
        full: 8
      txns_per_thread:
        fast: 500
        full: 5000
      batch_size:
        fast: 16
        full: 64
      batch_wait_us:
        fast: 1000
        full: 5000
    env:
      MAKO_ENABLE_BATCH_VALIDATION: "1"
      MAKO_BATCH_VALIDATION_SIZE: "{batch_size}"
      MAKO_BATCH_VALIDATION_MAX_WAIT_US: "{batch_wait_us}"

  - name: batch_validation_stress_reorder_minid
    description: Batch validation + txn reordering (Min-ID FVS) on stress harness.
    command: "./build/test_batch_validation_stress {threads} {txns_per_thread}"
    placeholders:
      threads:
        fast: 2
        full: 8
      txns_per_thread:
        fast: 500
        full: 5000
      batch_size:
        fast: 16
        full: 64
      batch_wait_us:
        fast: 1000
        full: 5000
    env:
      MAKO_ENABLE_BATCH_VALIDATION: "1"
      MAKO_ENABLE_TXN_REORDER: "1"
      MAKO_TXN_REORDER_FVS: "min"
      MAKO_TXN_REORDER_ALGO: "sort"
      MAKO_BATCH_VALIDATION_SIZE: "{batch_size}"
      MAKO_BATCH_VALIDATION_MAX_WAIT_US: "{batch_wait_us}"

  - name: batch_validation_stress_reorder_prod
    description: Batch validation + txn reordering (degree-product FVS) on stress harness.
    command: "./build/test_batch_validation_stress {threads} {txns_per_thread}"
    placeholders:
      threads:
        fast: 2
        full: 8
      txns_per_thread:
        fast: 500
        full: 5000
      batch_size:
        fast: 16
        full: 64
      batch_wait_us:
        fast: 1000
        full: 5000
    env:
      MAKO_ENABLE_BATCH_VALIDATION: "1"
      MAKO_ENABLE_TXN_REORDER: "1"
      MAKO_TXN_REORDER_FVS: "prod"
      MAKO_TXN_REORDER_ALGO: "sort"
      MAKO_BATCH_VALIDATION_SIZE: "{batch_size}"
      MAKO_BATCH_VALIDATION_MAX_WAIT_US: "{batch_wait_us}"

  - name: batch_validation_stress_storage
    description: Batch validation + storage-stage reordering on stress harness.
    command: "./build/test_batch_validation_stress {threads} {txns_per_thread}"
    placeholders:
      threads:
        fast: 2
        full: 8
      txns_per_thread:
        fast: 500
        full: 5000
      batch_size:
        fast: 16
        full: 64
      batch_wait_us:
        fast: 1000
        full: 5000
      storage_batch:
        fast: 16
        full: 64
      storage_wait_us:
        fast: 500
        full: 2000
    env:
      MAKO_ENABLE_BATCH_VALIDATION: "1"
      MAKO_BATCH_VALIDATION_SIZE: "{batch_size}"
      MAKO_BATCH_VALIDATION_MAX_WAIT_US: "{batch_wait_us}"
      MAKO_ENABLE_STORAGE_REORDER: "1"
      MAKO_STORAGE_REORDER_SIZE: "{storage_batch}"
      MAKO_STORAGE_REORDER_MAX_WAIT_US: "{storage_wait_us}"

  - name: batch_validation_stress_wait500
    description: Batch validation stress test with shorter wait time.
    command: "./build/test_batch_validation_stress {threads} {txns_per_thread}"
    placeholders:
      threads:
        fast: 2
        full: 8
      txns_per_thread:
        fast: 500
        full: 5000
      batch_size:
        fast: 16
        full: 64
      batch_wait_us:
        fast: 500
        full: 2000
    env:
      MAKO_ENABLE_BATCH_VALIDATION: "1"
      MAKO_BATCH_VALIDATION_SIZE: "{batch_size}"
      MAKO_BATCH_VALIDATION_MAX_WAIT_US: "{batch_wait_us}"

  - name: batch_validation_stress_storage_wait200
    description: Stress storage-stage reordering with shorter waits.
    command: "./build/test_batch_validation_stress {threads} {txns_per_thread}"
    placeholders:
      threads:
        fast: 2
        full: 8
      txns_per_thread:
        fast: 500
        full: 5000
      batch_size:
        fast: 16
        full: 64
      batch_wait_us:
        fast: 500
        full: 2000
      storage_batch:
        fast: 16
        full: 64
      storage_wait_us:
        fast: 200
        full: 1000
    env:
      MAKO_ENABLE_BATCH_VALIDATION: "1"
      MAKO_BATCH_VALIDATION_SIZE: "{batch_size}"
      MAKO_BATCH_VALIDATION_MAX_WAIT_US: "{batch_wait_us}"
      MAKO_ENABLE_STORAGE_REORDER: "1"
      MAKO_STORAGE_REORDER_SIZE: "{storage_batch}"
      MAKO_STORAGE_REORDER_MAX_WAIT_US: "{storage_wait_us}"

  - name: batch_validation_stress_highbatch
    description: Batch validation stress test with higher concurrency and batch size.
    command: "./build/test_batch_validation_stress {threads} {txns_per_thread}"
    placeholders:
      threads:
        fast: 8
        full: 16
      txns_per_thread:
        fast: 1000
        full: 5000
      batch_size:
        fast: 64
        full: 128
      batch_wait_us:
        fast: 5000
        full: 10000
    env:
      MAKO_ENABLE_BATCH_VALIDATION: "1"
      MAKO_BATCH_VALIDATION_SIZE: "{batch_size}"
      MAKO_BATCH_VALIDATION_MAX_WAIT_US: "{batch_wait_us}"

  - name: dbtest_baseline_tpcc
    description: Baseline dbtest TPCC run (sequential validation) using default config.
    command: "./build/dbtest -q config/mako_single_node.yml -N local_s0 -t {threads}"
    placeholders:
      threads:
        fast: 2
        full: 24
    env:
      MAKO_ENABLE_BATCH_VALIDATION: "0"
      DBTEST_EXIT_AFTER_SECS:
        fast: 5
        full: 60

  - name: dbtest_batch_validation_tpcc
    description: dbtest TPCC run with batch validation enabled.
    command: "./build/dbtest -q config/mako_single_node.yml -N local_s0 -t {threads}"
    placeholders:
      threads:
        fast: 2
        full: 24
      batch_size:
        fast: 16
        full: 64
      batch_wait_us:
        fast: 1000
        full: 5000
    env:
      MAKO_ENABLE_BATCH_VALIDATION: "1"
      MAKO_BATCH_VALIDATION_SIZE: "{batch_size}"
      MAKO_BATCH_VALIDATION_MAX_WAIT_US: "{batch_wait_us}"
