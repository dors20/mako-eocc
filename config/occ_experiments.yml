      MAKO_BATCH_VALIDATION_MAX_WAIT_US: "{batch_wait_us}"
      DBTEST_EXIT_AFTER_SECS:
        fast: 5
        full: 60

  - name: dbtest_batch_validation_reorder_prod
    description: dbtest TPCC with batch validation + txn reordering (degree-product FVS).
    command: "./build/dbtest -q config/mako_single_node.yml -N local_s0 -t {threads}"
    placeholders:
      threads:
        fast: 2
        full: 24
      batch_size:
        fast: 16
